name: Daily Smoke - Uplizd Products

on:
  schedule:
    # 00:00 UTC = 07:00 sáng giờ Việt Nam
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  smoke-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Unicorn Smoke Tests
        id: test
        run: npx playwright test tests/unicorn/smoke.spec.js
        continue-on-error: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Gửi email khi FAIL (bất kể manual hay schedule)
      - name: Send Email on Failure
        if: steps.test.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          subject: "🚨 [Uplizd] Unicorn Smoke Test FAILED"
          to: felixvoai@gmail.com
          from: Uplizd Auto Test
          body: |
            Unicorn Daily Smoke Test đã FAILED.
            
            Xem chi tiết: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          secure: true

      # Gửi email khi PASS (cả manual lẫn schedule) — dùng để kiểm tra
      - name: Send Email on Success
        if: steps.test.outcome == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          subject: "✅ [Uplizd] Unicorn Smoke Test PASSED"
          to: felixvoai@gmail.com
          from: Uplizd Auto Test
          body: |
            Unicorn Daily Smoke Test đã PASSED thành công.
            
            Chi tiết: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          secure: true